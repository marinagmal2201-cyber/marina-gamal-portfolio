<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Fire alarm panel to public address interface diagram">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#202530"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5a524"/></marker>
  </defs>
  <rect width="600" height="400" fill="#12151b"/><rect width="600" height="400" fill="url(#g)"/>
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="40" y="150" width="120" height="80" rx="8" fill="#181c24" stroke="#e5484d" stroke-width="2"/>
    <text x="100" y="186" fill="#e8eaf0">FIRE ALARM</text><text x="100" y="204" fill="#e5484d">PANEL (FACP)</text>
    <rect x="240" y="150" width="120" height="80" rx="8" fill="#181c24" stroke="#f5a524" stroke-width="2"/>
    <text x="300" y="186" fill="#e8eaf0">INTERFACE</text><text x="300" y="204" fill="#f5a524">MODULE</text>
