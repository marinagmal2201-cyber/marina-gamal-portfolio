    <text x="500" y="186" fill="#e8eaf0">PUBLIC</text><text x="500" y="204" fill="#8892a6">ADDRESS</text>
  </g>
  <path d="M160 190H240M360 190H440" stroke="#f5a524" stroke-width="2.5" marker-end="url(#a)"/>
  <g fill="none" stroke="#8892a6" stroke-width="2"><path d="M500 230V290"/><circle cx="470" cy="305" r="10"/><circle cx="500" cy="305" r="10"/><circle cx="530" cy="305" r="10"/></g>
  <text x="200" y="176" fill="#98a0b0" font-family="monospace" font-size="10" text-anchor="middle">signal</text>
  <text x="400" y="176" fill="#98a0b0" font-family="monospace" font-size="10" text-anchor="middle">mute / evac</text>
  <rect x="430" y="346" width="150" height="34" fill="#12151b" stroke="#5b6577"/>
  <text x="440" y="361" fill="#98a0b0" font-family="monospace" font-size="10">FACP / PA</text>
  <text x="440" y="374" fill="#e8eaf0" font-family="monospace" font-size="10">INTERFACE</text>
